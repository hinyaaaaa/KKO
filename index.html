<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KKO">
<meta name="theme-color" content="#ffc83d">
<link rel="apple-touch-icon" id="kko-icon" href="">
<!-- ホーム画面アイコン: 画像ファイルを追加しないノービルド方針のまま、canvasで描く。
     黄色の地に、レンズ(=シャッター)をひとつ。アプリ内のシャッターボタンと同じ形。 -->
<script id="kko-icon-gen">(function(){
function drawKkoIcon(canvas){
  var S=canvas.width, ctx=canvas.getContext('2d'), c=S/2;
  ctx.fillStyle='#ffc83d'; ctx.fillRect(0,0,S,S);
  [[0.31,'#000'],[0.21,'#fff'],[0.125,'#000']].forEach(function(p){
    ctx.beginPath(); ctx.arc(c,c,S*p[0],0,Math.PI*2); ctx.fillStyle=p[1]; ctx.fill();
  });
  ctx.beginPath(); ctx.arc(c-S*0.045,c-S*0.05,S*0.03,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
}
var c=document.createElement('canvas'); c.width=180; c.height=180; drawKkoIcon(c);
var png=c.toDataURL('image/png');
document.getElementById('kko-icon').href=png;
['57','72','76','114','120','144','152','180'].forEach(function(sz){
  var l=document.createElement('link'); l.rel='apple-touch-icon';
  l.setAttribute('sizes',sz+'x'+sz); l.href=png; document.head.appendChild(l);
});
})();</script>
<title>KKO</title>
<link rel="preload" href="fonts/dela-gothic-one-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 推し選択: 推しカラーが画面全体を染める。タブ=直接選択、横スワイプでも切り替わる -->
<div id="select-screen">
  <header class="sel-head">
    <span class="wordmark">KKO</span>
    <nav id="select-dots" class="sel-tabs" aria-label="推しを選ぶ"></nav>
  </header>
  <div id="select-preview" aria-hidden="true" data-state="idle"></div>
  <div id="character-list" class="char-carousel"></div>
  <footer class="sel-foot">
    <span>非公式のファン作品です</span>
    <button type="button" id="credits-btn" class="text-btn">クレジット</button>
  </footer>
</div>

<!-- 許可の説明(初回のみ) -->
<div id="start-screen">
  <div class="start-card">
    <h1>3つだけ、<br>許可してください</h1>
    <div class="perm-list">
      <div class="perm-row"><span class="perm-mark"><span class="icon-svg" data-icon="camera"></span></span><span class="perm-text"><b>カメラ</b><span>背景に、いまの景色を映すため</span></span></div>
      <div class="perm-row"><span class="perm-mark"><span class="icon-svg" data-icon="compass"></span></span><span class="perm-text"><b>向きの検知</b><span>向いている方角を合わせるため</span></span></div>
      <div class="perm-row"><span class="perm-mark"><span class="icon-svg" data-icon="motion"></span></span><span class="perm-text"><b>モーション</b><span>手ぶれを見つけて、撮り逃しを防ぐため</span></span></div>
    </div>
    <p class="start-note" id="start-error"></p>
    <button id="start-btn">許可して始める</button>
    <p class="start-foot">カメラ映像と撮った写真は、端末の外へ送られません</p>
  </div>
</div>

<!-- 撮影ステージ -->
<div id="stage-wrap">
  <div id="stage">
    <video id="camera-video" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>
  </div>
</div>
<div id="flash-overlay"></div>
<div id="countdown-overlay"><span id="countdown-num"></span></div>

<!-- 立ち位置の決定(初回・再配置共通) -->
<div id="placement-intro">
  <div id="placement-intro-text">円をドラッグして、立つ位置を決めてください</div>
  <div id="placement-distance-badge"><span id="placement-distance-val">—</span>m先</div>
</div>
<div id="placement-actions">
  <button id="placement-cancel-btn">キャンセル</button>
  <button id="placement-confirm-btn">ここに立たせる</button>
</div>

<!-- 撮影中の操作 -->
<div id="ui-layer">
  <div id="top-controls">
    <div id="top-bar">
      <button id="dock-toggle" aria-label="メニュー" aria-haspopup="true"><span class="dt-wrap"><span class="dt-dot"></span><span class="dt-dot"></span><span class="dt-dot"></span></span></button>
    </div>
  </div>

  <div id="top-dock" role="menu">
    <button id="reticle-btn" class="fan-btn" role="menuitem"><span class="icon-svg" data-icon="target"></span><span class="fan-label">立ち位置を決め直す</span></button>
    <button id="timer-btn" class="fan-btn" role="menuitem"><span class="icon-svg" data-icon="timer"></span><span class="fan-label">タイマー</span></button>
    <button id="mode-btn" class="fan-btn" role="menuitem"><span class="mode-chip-fan icon-svg" data-icon="camera"></span><span class="fan-label">写真</span></button>
    <button id="shadow-adjust-btn" class="fan-btn" role="menuitem"><span class="icon-svg" data-icon="shadow"></span><span class="fan-label">影を調整</span></button>
    <button id="reset-btn" class="fan-btn" role="menuitem"><span class="icon-svg" data-icon="reset"></span><span class="fan-label">推しを選び直す</span></button>
    <button id="debug-btn" class="fan-btn fan-btn-quiet" role="menuitem"><span class="icon-svg" data-icon="log"></span><span class="fan-label">ログ</span></button>
  </div>

  <div id="bottom-controls">
    <div id="ring-label"></div>
    <div id="pose-rings"></div>
    <div id="bottom-bar">
      <div id="shutter-status"></div>
      <div id="capture-row">
        <button id="shutter-btn" aria-label="撮影"></button>
      </div>
    </div>
  </div>
</div>

<!-- 撮影結果: 推しカラーの上に、プリントのように置く -->
<div id="result-screen">
  <div id="result-imgwrap">
    <img id="result-img" alt="撮影結果">
    <video id="result-video" playsinline controls loop></video>
  </div>
  <p class="result-hint" id="result-hint">下へスワイプしても撮り直せます</p>
  <div id="result-actions">
    <button id="share-btn">保存・共有</button>
    <button id="retake-btn">撮り直す</button>
  </div>
</div>

<!-- 影の手動調整(通常は自動。うまくいかないときだけ) -->
<div id="shadow-panel">
  <div class="shadow-panel-head">
    <span>影の向きと長さ</span>
    <button id="shadow-panel-close" class="sheet-close" aria-label="閉じる"><span class="icon-svg" data-icon="close"></span></button>
  </div>
  <p class="shadow-panel-sub">円の中で指を動かすと、向きと長さを同時に変えられます。中心に近いほど短く、外側ほど長くなります。</p>
  <div class="shadow-dial-wrap">
    <div class="shadow-dial disabled" id="shadow-dial">
      <div class="shadow-dial-center"></div>
      <div class="shadow-dial-handle" id="shadow-dial-handle"><span class="icon-svg" data-icon="sun"></span></div>
      <span class="shadow-dial-label n">0°</span>
    </div>
  </div>
  <div class="shadow-panel-row">
    <button id="shadow-manual-toggle" class="shadow-toggle-btn">手動: オフ</button>
    <button id="shadow-reset-btn" class="shadow-reset-btn">自動に戻す</button>
  </div>
  <p class="shadow-panel-hint">ふだんは周りの明るさから自動で決まります。不自然なときだけ、手動をオンにしてください。</p>
</div>

<!-- 指差しポーズ専用 -->
<div id="point-adjust-panel">
  <div class="point-adjust-head">指す方向</div>
  <div class="point-adjust-row"><label for="point-yaw">左右</label><input type="range" id="point-yaw" min="-30" max="30" step="1" value="0"></div>
  <div class="point-adjust-row"><label for="point-pitch">上下</label><input type="range" id="point-pitch" min="-25" max="25" step="1" value="0"></div>
</div>

<div id="pose-toast"></div>

<!-- クレジット -->
<div id="credits-sheet" role="dialog" aria-modal="true" aria-labelledby="credits-title">
  <div class="sheet-card">
    <div class="sheet-head"><h2 id="credits-title">クレジット</h2><button type="button" id="credits-close" class="sheet-close" aria-label="閉じる"><span class="icon-svg" data-icon="close"></span></button></div>
    <div id="credits-body"></div>
  </div>
</div>

<div id="loading-overlay">
  <div id="loading-text">読み込み中</div>
  <div class="loading-spinner"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="js/pose-ring.js"></script>
<script src="js/ui-gestures.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
