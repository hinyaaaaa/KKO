# pushのたびに自動テストを回す。結果はGitHubの「Actions」タブ(GitHub Desktopなら Repository > View on GitHub)で見られる。
name: test
on:
  push:
  pull_request:

jobs:
  chromium:
    name: テスト一式(Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
        env:
          KKO_BROWSER_ARGS: --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist --autoplay-policy=no-user-gesture-required
      - name: 描画結果の画像を保存(目視用)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: render-images, path: out/, if-no-files-found: ignore }

  webkit:
    # iPhoneのSafariと同系統(WebKit)。録画・描画・選択画面の確認。結果は参考(落ちても全体は失敗にしない)。
    name: WebKit(iPhone相当の参考)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install webkit
      - run: npm run test:webkit
        env:
          KKO_ENGINE: webkit
      - name: 描画結果の画像を保存(目視用)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: render-images-webkit, path: out/, if-no-files-found: ignore }
